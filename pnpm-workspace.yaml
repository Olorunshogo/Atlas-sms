packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/atlas-ui/*'
  - 'packages/atlas-ui/*'
  - 'libs/*'
  - 'libs/shared/*'

saveExact: true
minimumReleaseAge: 14400

catalog:
  zod: 4.3.6
  vee-validate: 4.15.1
  '@vee-validate/zod': 4.15.1

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - bcrypt
  - esbuild
  - less
  - nx
  - sharp
  - unrs-resolver
  - vue-demi
  - workerd

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.43'
  - '@vue/compiler-dom@3.5.43'
  - '@vue/compiler-sfc@3.5.43'
  - '@vue/compiler-ssr@3.5.43'
  - '@vue/reactivity@3.5.43'
  - '@vue/runtime-core@3.5.43'
  - '@vue/runtime-dom@3.5.43'
  - '@vue/server-renderer@3.5.43'
  - '@vue/shared@3.5.43'
  - vue@3.5.43

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  nx: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
  workerd: false
